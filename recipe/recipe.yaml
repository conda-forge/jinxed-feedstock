schema_version: 1

context:
  name: jinxed
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7e755b831faa2443d44fb4ce7c0202eb9c3ed39bd5bf1193365888f4f6092b54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - if: win
      then:
        - __win
        - ansicon
      else:
        - __unix
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jinxed
        - jinxed.terminfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Jinxed Terminal Library
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/jinxed/

extra:
  recipe-maintainers:
    - mattip
